id: interview-60
name: Interview prep in 60 days
description: Eight weeks of patterns, then four buffer days. Every week ends with a review day.
language: any
hoursPerDay: 2
days:
  - { day: 1, title: Complexity and arrays, concepts: [complexity-basics, arrays-strings], problems: [contains-duplicate, best-time-to-buy-and-sell-stock], quizzes: [complexity] }
  - { day: 2, title: Hashing, concepts: [hashing], problems: [valid-anagram, two-sum, group-anagrams] }
  - { day: 3, title: Hashing, concepts: [hashing], problems: [top-k-frequent-elements, longest-consecutive-sequence, valid-sudoku] }
  - { day: 4, title: Prefix sums, concepts: [prefix-sums], problems: [product-of-array-except-self, encode-and-decode-strings] }
  - { day: 5, title: Two pointers, concepts: [two-pointers], problems: [valid-palindrome, two-sum-ii-input-array-is-sorted, 3sum] }
  - { day: 6, title: Two pointers, concepts: [two-pointers], problems: [container-with-most-water, trapping-rain-water], quizzes: [pattern] }
  - { day: 7, title: Review week 1, review: true }
  - { day: 8, title: Sliding window, concepts: [sliding-window], problems: [longest-substring-without-repeating-characters, longest-repeating-character-replacement] }
  - { day: 9, title: Sliding window, concepts: [sliding-window], problems: [permutation-in-string, minimum-window-substring, sliding-window-maximum], optional: [sliding-window-maximum] }
  - { day: 10, title: Stacks, concepts: [stack], problems: [valid-parentheses, min-stack, evaluate-reverse-polish-notation] }
  - { day: 11, title: Monotonic stack, concepts: [monotonic-stack], problems: [daily-temperatures, car-fleet, largest-rectangle-in-histogram], optional: [largest-rectangle-in-histogram] }
  - { day: 12, title: Binary search, concepts: [sorting, binary-search], problems: [binary-search, search-a-2d-matrix, koko-eating-bananas] }
  - { day: 13, title: Binary search, concepts: [binary-search], problems: [find-minimum-in-rotated-sorted-array, search-in-rotated-sorted-array, time-based-key-value-store] }
  - { day: 14, title: Review week 2, review: true }
  - { day: 15, title: Linked lists, concepts: [linked-lists], problems: [reverse-linked-list, merge-two-sorted-lists, linked-list-cycle] }
  - { day: 16, title: Linked lists, concepts: [linked-lists], problems: [remove-nth-node-from-end-of-list, reorder-list, add-two-numbers] }
  - { day: 17, title: Recursion and trees, concepts: [recursion-basics, binary-trees], problems: [invert-binary-tree, maximum-depth-of-binary-tree, same-tree] }
  - { day: 18, title: Trees, concepts: [binary-trees], problems: [diameter-of-binary-tree, balanced-binary-tree, subtree-of-another-tree] }
  - { day: 19, title: Traversals, concepts: [tree-traversals], problems: [binary-tree-level-order-traversal, binary-tree-right-side-view, count-good-nodes-in-binary-tree] }
  - { day: 20, title: Traversals, concepts: [tree-traversals], problems: [construct-binary-tree-from-preorder-and-inorder-traversal, serialize-and-deserialize-binary-tree], optional: [serialize-and-deserialize-binary-tree] }
  - { day: 21, title: Review week 3, review: true }
  - { day: 22, title: Binary search trees, concepts: [bst], problems: [validate-binary-search-tree, kth-smallest-element-in-a-bst, lowest-common-ancestor-of-a-binary-search-tree] }
  - { day: 23, title: Heaps, concepts: [heaps], problems: [kth-largest-element-in-a-stream, last-stone-weight, k-closest-points-to-origin] }
  - { day: 24, title: Heaps, concepts: [heaps], problems: [kth-largest-element-in-an-array, task-scheduler, find-median-from-data-stream], optional: [find-median-from-data-stream] }
  - { day: 25, title: Tries, concepts: [tries], problems: [implement-trie-prefix-tree, design-add-and-search-words-data-structure, word-search-ii], optional: [word-search-ii] }
  - { day: 26, title: Graph basics, concepts: [graph-basics, dfs], problems: [clone-graph, number-of-islands] }
  - { day: 27, title: Grids, concepts: [grid-graphs], problems: [max-area-of-island, rotting-oranges, pacific-atlantic-water-flow] }
  - { day: 28, title: Review week 4, review: true }
  - { day: 29, title: Breadth-first search, concepts: [bfs], problems: [walls-and-gates, surrounded-regions, word-ladder], optional: [word-ladder] }
  - { day: 30, title: Topological sort, concepts: [topological-sort], problems: [course-schedule, course-schedule-ii] }
  - { day: 31, title: Union-find, concepts: [union-find], problems: [redundant-connection, number-of-connected-components-in-an-undirected-graph, graph-valid-tree] }
  - { day: 32, title: Shortest paths, concepts: [shortest-paths], problems: [network-delay-time, cheapest-flights-within-k-stops] }
  - { day: 33, title: Minimum spanning trees, concepts: [mst], problems: [min-cost-to-connect-all-points, swim-in-rising-water] }
  - { day: 34, title: Graph mix, problems: [alien-dictionary, reconstruct-itinerary], optional: [reconstruct-itinerary], quizzes: [pattern] }
  - { day: 35, title: Review week 5, review: true }
  - { day: 36, title: Backtracking, concepts: [backtracking], problems: [subsets, combination-sum, permutations] }
  - { day: 37, title: Backtracking, concepts: [backtracking], problems: [subsets-ii, combination-sum-ii, word-search] }
  - { day: 38, title: Backtracking, concepts: [backtracking], problems: [palindrome-partitioning, letter-combinations-of-a-phone-number, n-queens], optional: [n-queens] }
  - { day: 39, title: Dynamic programming, concepts: [dp-1d], problems: [climbing-stairs, min-cost-climbing-stairs, house-robber] }
  - { day: 40, title: Dynamic programming, concepts: [dp-1d], problems: [house-robber-ii, longest-palindromic-substring, palindromic-substrings] }
  - { day: 41, title: Dynamic programming, concepts: [dp-1d], problems: [decode-ways, coin-change, maximum-product-subarray] }
  - { day: 42, title: Review week 6, review: true }
  - { day: 43, title: Dynamic programming, concepts: [dp-knapsack], problems: [word-break, longest-increasing-subsequence, partition-equal-subset-sum] }
  - { day: 44, title: Two-dimensional DP, concepts: [dp-2d], problems: [unique-paths, longest-common-subsequence, edit-distance] }
  - { day: 45, title: Knapsack and strings, concepts: [dp-knapsack, dp-strings], problems: [coin-change-ii, target-sum, best-time-to-buy-and-sell-stock-with-cooldown] }
  - { day: 46, title: Intervals, concepts: [intervals], problems: [insert-interval, merge-intervals, non-overlapping-intervals] }
  - { day: 47, title: Intervals and greedy, concepts: [intervals, greedy], problems: [meeting-rooms, meeting-rooms-ii, maximum-subarray] }
  - { day: 48, title: Greedy, concepts: [greedy], problems: [jump-game, jump-game-ii, gas-station] }
  - { day: 49, title: Review week 7, review: true }
  - { day: 50, title: Mock interview 1, problems: [lru-cache, merge-k-sorted-lists], focus: "45 minutes, no hints, talk through your plan before coding" }
  - { day: 51, title: Hard problems, problems: [binary-tree-maximum-path-sum, median-of-two-sorted-arrays] }
  - { day: 52, title: Company lists, problems: [rotate-image, spiral-matrix], quizzes: [pattern], focus: "Open the Companies page and work the top of your target company's list" }
  - { day: 53, title: Weak spots, problems: [longest-increasing-path-in-a-matrix, partition-labels, set-matrix-zeroes], focus: "Swap in problems from the concepts the skill tree shows as weakest" }
  - { day: 54, title: Quizzes and bits, problems: [single-number, counting-bits], quizzes: [complexity, pattern] }
  - { day: 55, title: Mock interview 2, problems: [hand-of-straights, happy-number], focus: "30 minutes, one medium, state brute force first" }
  - { day: 56, title: Review week 8, review: true }
  - { day: 57, title: Buffer, review: true, focus: "Catch up on anything marked overdue" }
  - { day: 58, title: Buffer, review: true, focus: "Redo problems you needed hints for" }
  - { day: 59, title: Buffer, review: true, focus: "Review flashcards and templates" }
  - { day: 60, title: Final review, review: true, focus: "Light day. Skim your notes and rest" }
