items:
  - id: 1
    topic: loops
    code:
      java: &a1 |
        int count = 0;
        for (int i = 1; i < n; i *= 2)
            count++;
      cpp: *a1
    time: "O(log n)"
    space: "O(1)"
    options:
      time: ["O(1)", "O(log n)", "O(n)", "O(n log n)"]
      space: ["O(1)", "O(log n)", "O(n)"]
    why: "i doubles each step, so there are about log2(n) iterations."
    trap: false
    concepts: [complexity-basics]
  - id: 2
    topic: loops
    code:
      java: &a2 |
        int count = 0;
        for (int i = 0; i < n; i++)
            for (int j = i + 1; j < n; j++)
                count++;
      cpp: *a2
    time: "O(n²)"
    space: "O(1)"
    options:
      time: ["O(n)", "O(n log n)", "O(n²)", "O(n³)"]
      space: ["O(1)", "O(n)", "O(n²)"]
    why: "The body runs n(n-1)/2 times, which is quadratic."
    trap: false
    concepts: [complexity-basics]
  - id: 3
    topic: loops
    code:
      java: &a3 |
        int count = 0;
        for (int i = 1; i <= n; i++)
            for (int j = i; j <= n; j += i)
                count++;
      cpp: *a3
    time: "O(n log n)"
    space: "O(1)"
    options:
      time: ["O(n)", "O(n log n)", "O(n²)", "O(n√n)"]
      space: ["O(1)", "O(log n)", "O(n)"]
    why: "The inner loop runs n/i times, so the total is n(1 + 1/2 + 1/3 + ...), the harmonic series, about n ln n."
    trap: true
    concepts: [complexity-basics]
  - id: 4
    topic: loops
    code:
      java: &a4 |
        int count = 0;
        for (int i = 0; i < n; i++)
            for (int j = 0; j < 10; j++)
                count++;
      cpp: *a4
    time: "O(n)"
    space: "O(1)"
    options:
      time: ["O(n)", "O(n log n)", "O(n²)", "O(1)"]
      space: ["O(1)", "O(n)", "O(n²)"]
    why: "The inner loop is a constant 10 iterations, so two nested loops are not automatically quadratic."
    trap: true
    concepts: [complexity-basics]
  - id: 5
    topic: loops
    code:
      java: &a5 |
        int count = 0;
        for (int i = 0; i < n; i++)
            for (int j = 0; j < n; j++) {
                count++;
                if (j == 5) break;
            }
      cpp: *a5
    time: "O(n)"
    space: "O(1)"
    options:
      time: ["O(n)", "O(n log n)", "O(n²)", "O(1)"]
      space: ["O(1)", "O(n)", "O(n²)"]
    why: "The inner loop stops after 6 iterations whatever n is."
    trap: true
    concepts: [complexity-basics]
  - id: 6
    topic: loops
    code:
      java: &a6 |
        int count = 0;
        for (int i = n; i > 0; i /= 2)
            for (int j = 0; j < i; j++)
                count++;
      cpp: *a6
    time: "O(n)"
    space: "O(1)"
    options:
      time: ["O(log n)", "O(n)", "O(n log n)", "O(n²)"]
      space: ["O(1)", "O(log n)", "O(n)"]
    why: "The work is n + n/2 + n/4 + ..., a geometric series that sums to about 2n."
    trap: true
    concepts: [complexity-basics]
  - id: 7
    topic: loops
    code:
      java: &a7 |
        int count = 0;
        for (int i = 0; i < n; i++)
            for (int j = 1; j < n; j *= 2)
                count++;
      cpp: *a7
    time: "O(n log n)"
    space: "O(1)"
    options:
      time: ["O(n)", "O(n log n)", "O(n²)", "O(log n)"]
      space: ["O(1)", "O(log n)", "O(n)"]
    why: "n outer iterations, each with log2(n) inner iterations."
    trap: false
    concepts: [complexity-basics]
  - id: 8
    topic: loops
    code:
      java: &a8 |
        int count = 0;
        for (int i = 0; i < n; i++)
            for (int j = 0; j < n; j++)
                for (int k = 0; k < n; k++)
                    count++;
      cpp: *a8
    time: "O(n³)"
    space: "O(1)"
    options:
      time: ["O(n²)", "O(n³)", "O(n log n)", "O(2ⁿ)"]
      space: ["O(1)", "O(n)", "O(n³)"]
    why: "Three independent loops of n iterations multiply to n³."
    trap: false
    concepts: [complexity-basics]
  - id: 9
    topic: loops
    code:
      java: &a9 |
        int count = 0;
        for (int i = 1; i * i <= n; i++)
            count++;
      cpp: *a9
    time: "O(√n)"
    space: "O(1)"
    options:
      time: ["O(log n)", "O(√n)", "O(n)", "O(n log n)"]
      space: ["O(1)", "O(√n)", "O(n)"]
    why: "The loop stops when i exceeds sqrt(n)."
    trap: false
    concepts: [complexity-basics]
  - id: 10
    topic: loops
    code:
      java: &a10 |
        int count = 0;
        for (int i = 0; i < n; i += 3)
            count++;
      cpp: *a10
    time: "O(n)"
    space: "O(1)"
    options:
      time: ["O(1)", "O(log n)", "O(n)", "O(n²)"]
      space: ["O(1)", "O(n)", "O(n/3)"]
    why: "Adding a constant step still gives about n/3 iterations, and constants are dropped."
    trap: false
    concepts: [complexity-basics]
  - id: 11
    topic: loops
    code:
      java: &a11 |
        int count = 0;
        for (int i = 0; i < n; i++)
            count++;
        for (int i = 0; i < n; i++)
            for (int j = 0; j < n; j++)
                count++;
      cpp: *a11
    time: "O(n²)"
    space: "O(1)"
    options:
      time: ["O(n)", "O(n²)", "O(n³)", "O(n² + n)"]
      space: ["O(1)", "O(n)", "O(n²)"]
    why: "Sequential blocks add, and the slower term n² dominates n + n²."
    trap: false
    concepts: [complexity-basics]
  - id: 12
    topic: loops
    code:
      java: &a12 |
        int count = 0;
        for (int i = 1; i < n; i *= 2)
            for (int j = 0; j < i; j++)
                count++;
      cpp: *a12
    time: "O(n)"
    space: "O(1)"
    options:
      time: ["O(log n)", "O(n)", "O(n log n)", "O(n²)"]
      space: ["O(1)", "O(log n)", "O(n)"]
    why: "The work is 1 + 2 + 4 + ... + n/2, which is under n in total."
    trap: true
    concepts: [complexity-basics]
