  - id: 39
    topic: data-structures
    code:
      java: |
        // list is an ArrayList with n elements
        while (!list.isEmpty())
            list.remove(0);
      cpp: |
        // v is a vector with n elements
        while (!v.empty())
            v.erase(v.begin());
    time: "O(n²)"
    space: "O(1)"
    options:
      time: ["O(n)", "O(n log n)", "O(n²)", "O(1)"]
      space: ["O(1)", "O(n)", "O(n²)"]
    why: "Each removal at the front shifts all remaining elements."
    trap: true
    concepts: [complexity-basics, queue-deque]
  - id: 40
    topic: data-structures
    code:
      java: |
        // list is a LinkedList with n elements
        long sum = 0;
        for (int i = 0; i < n; i++)
            sum += list.get(i);
      cpp: |
        // l is a std::list with n elements
        long long sum = 0;
        for (int i = 0; i < n; i++)
            sum += *next(l.begin(), i);
    time: "O(n²)"
    space: "O(1)"
    options:
      time: ["O(n)", "O(n log n)", "O(n²)", "O(1)"]
      space: ["O(1)", "O(n)", "O(n²)"]
    why: "Reaching index i in a linked list walks i nodes, so n lookups cost n²."
    trap: true
    concepts: [linked-lists]
  - id: 41
    topic: data-structures
    code:
      java: |
        // expected case, good hash function
        Map<Integer, Integer> m = new HashMap<>();
        for (int i = 0; i < n; i++) m.put(i, i);
        for (int i = 0; i < n; i++) sum += m.get(i);
      cpp: |
        // expected case, good hash function
        unordered_map<int, int> m;
        for (int i = 0; i < n; i++) m[i] = i;
        for (int i = 0; i < n; i++) sum += m[i];
    time: "O(n)"
    space: "O(n)"
    options:
      time: ["O(n)", "O(n log n)", "O(n²)", "O(1)"]
      space: ["O(1)", "O(log n)", "O(n)"]
    why: "Hash puts and gets are expected O(1)."
    trap: false
    concepts: [hashing]
  - id: 42
    topic: data-structures
    code:
      java: |
        TreeMap<Integer, Integer> m = new TreeMap<>();
        for (int i = 0; i < n; i++) m.put(i, i);
