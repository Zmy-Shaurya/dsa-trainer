  - id: 43
    topic: data-structures
    code:
      java: |
        PriorityQueue<Integer> pq = new PriorityQueue<>();
        for (int x : a) pq.offer(x);
        while (!pq.isEmpty()) pq.poll();
      cpp: |
        priority_queue<int> pq;
        for (int x : a) pq.push(x);
        while (!pq.empty()) pq.pop();
    time: "O(n log n)"
    space: "O(n)"
    options:
      time: ["O(n)", "O(n log n)", "O(n²)", "O(log n)"]
      space: ["O(1)", "O(log n)", "O(n)"]
    why: "n pushes and n pops at O(log n) each. This is heap sort without the in-place trick."
    trap: false
    concepts: [heaps]
  - id: 44
    topic: data-structures
    code:
      java: |
        int lo = 0, hi = n - 1;
        while (lo <= hi) {
            int mid = lo + (hi - lo) / 2;
            if (a[mid] < x) lo = mid + 1;
            else if (a[mid] > x) hi = mid - 1;
            else return mid;
        }
      cpp: |
        int lo = 0, hi = n - 1;
        while (lo <= hi) {
            int mid = lo + (hi - lo) / 2;
            if (a[mid] < x) lo = mid + 1;
            else if (a[mid] > x) hi = mid - 1;
            else return mid;
        }
    time: "O(log n)"
    space: "O(1)"
    options:
      time: ["O(1)", "O(log n)", "O(n)", "O(n log n)"]
      space: ["O(1)", "O(log n)", "O(n)"]
    why: "The range halves every iteration, and the loop version uses no stack."
    trap: false
    concepts: [binary-search]
  - id: 45
    topic: data-structures
    code:
      java: |
        // list is an ArrayList of n ints
        for (int x : queries)               // n queries
            if (list.contains(x)) found++;
      cpp: |
        // v is a vector of n ints
        for (int x : queries)               // n queries
            if (find(v.begin(), v.end(), x) != v.end()) found++;
    time: "O(n²)"
    space: "O(1)"
    options:
      time: ["O(n)", "O(n log n)", "O(n²)", "O(1)"]
      space: ["O(1)", "O(n)", "O(n²)"]
    why: "A list search is linear, and it runs n times. A hash set would make each lookup O(1)."
    trap: true
    concepts: [hashing, complexity-basics]
  - id: 46
    topic: data-structures
    code:
      java: |
        Set<Integer> set = new HashSet<>(list);   // n ints
        for (int x : queries)                      // n queries
            if (set.contains(x)) found++;
      cpp: |
        unordered_set<int> set(v.begin(), v.end());   // n ints
        for (int x : queries)                          // n queries
            if (set.count(x)) found++;
    time: "O(n)"
    space: "O(n)"
    options:
      time: ["O(n)", "O(n log n)", "O(n²)", "O(1)"]
      space: ["O(1)", "O(log n)", "O(n)"]
    why: "Building the set is O(n) and each lookup is expected O(1)."
    trap: false
    concepts: [hashing]
  - id: 47
    topic: data-structures
    code:
      java: |
        // insert n words of length L into a trie
        for (String w : words) {
            Node cur = root;
            for (char c : w.toCharArray()) {
                if (cur.next[c - 'a'] == null) cur.next[c - 'a'] = new Node();
                cur = cur.next[c - 'a'];
            }
        }
      cpp: |
        // insert n words of length L into a trie
        for (const string& w : words) {
            Node* cur = root;
            for (char c : w) {
                if (!cur->next[c - 'a']) cur->next[c - 'a'] = new Node();
                cur = cur->next[c - 'a'];
            }
        }
    time: "O(n·L)"
    space: "O(n·L)"
    options:
      time: ["O(n)", "O(n·L)", "O(n·L²)", "O(L)"]
      space: ["O(L)", "O(n)", "O(n·L)"]
    why: "Every character of every word is processed once, and in the worst case each one creates a node."
    trap: false
    concepts: [tries]
  - id: 48
    topic: data-structures
    code:
      java: |
        // Fenwick tree over n slots
        for (int i = 1; i <= n; i++)
            for (int j = i; j <= n; j += j & -j)
                tree[j] += a[i];
      cpp: |
        // Fenwick tree over n slots
        for (int i = 1; i <= n; i++)
            for (int j = i; j <= n; j += j & -j)
                tree[j] += a[i];
    time: "O(n log n)"
    space: "O(n)"
    options:
      time: ["O(n)", "O(n log n)", "O(n²)", "O(log n)"]
      space: ["O(1)", "O(log n)", "O(n)"]
    why: "Each update climbs at most log n tree slots, and there are n updates. The tree itself takes O(n) space."
    trap: false
    concepts: [range-queries]
  - id: 49
    topic: data-structures
    code:
      java: |
        // BFS over an r x c grid, each cell is enqueued at most once
        Deque<int[]> q = new ArrayDeque<>();
        boolean[][] seen = new boolean[r][c];
        q.add(new int[]{0, 0}); seen[0][0] = true;
        while (!q.isEmpty()) {
            int[] cur = q.poll();
            for (int[] d : DIRS) { /* push unseen in-bounds neighbours */ }
        }
      cpp: |
        // BFS over an r x c grid, each cell is enqueued at most once
        queue<pair<int,int>> q;
        vector<vector<bool>> seen(r, vector<bool>(c));
        q.push({0, 0}); seen[0][0] = true;
        while (!q.empty()) {
            auto cur = q.front(); q.pop();
            for (auto d : DIRS) { /* push unseen in-bounds neighbours */ }
        }
    time: "O(r·c)"
    space: "O(r·c)"
    options:
      time: ["O(r + c)", "O(r·c)", "O((r·c)²)", "O(r·c·log(r·c))"]
      space: ["O(r + c)", "O(min(r, c))", "O(r·c)"]
    why: "Each cell is visited once with a constant number of neighbours. The seen table alone is r x c."
    trap: false
    concepts: [grid-graphs, bfs]
  - id: 50
    topic: data-structures
    code:
      java: |
        Deque<Integer> dq = new ArrayDeque<>();
        for (int i = 0; i < n; i++)
            dq.addFirst(i);
      cpp: |
        deque<int> dq;
        for (int i = 0; i < n; i++)
            dq.push_front(i);
    time: "O(n)"
    space: "O(n)"
    options:
      time: ["O(n)", "O(n log n)", "O(n²)", "O(1)"]
      space: ["O(1)", "O(log n)", "O(n)"]
    why: "Adding at the front of a deque is O(1), unlike an ArrayList or vector where it shifts everything."
    trap: false
    concepts: [queue-deque]
