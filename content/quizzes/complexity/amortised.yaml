items:
  - id: 23
    topic: amortised
    code:
      java: |
        // a is sorted
        int j = 0, best = 0;
        for (int i = 0; i < n; i++) {
            while (j < n && a[j] - a[i] <= k) j++;
            best = Math.max(best, j - i);
        }
      cpp: |
        // a is sorted
        int j = 0, best = 0;
        for (int i = 0; i < n; i++) {
            while (j < n && a[j] - a[i] <= k) j++;
            best = max(best, j - i);
        }
    time: "O(n)"
    space: "O(1)"
    options:
      time: ["O(n)", "O(n log n)", "O(n²)", "O(k)"]
      space: ["O(1)", "O(n)", "O(k)"]
    why: "j never moves backwards, so the inner loop does at most n steps in total across all i."
    trap: true
    concepts: [two-pointers, complexity-basics]
  - id: 24
    topic: amortised
    code:
      java: |
        ArrayList<Integer> list = new ArrayList<>();
        for (int i = 0; i < n; i++)
            list.add(i);
      cpp: |
        vector<int> v;
        for (int i = 0; i < n; i++)
            v.push_back(i);
    time: "O(n)"
    space: "O(n)"
    options:
      time: ["O(n)", "O(n log n)", "O(n²)", "O(log n)"]
      space: ["O(1)", "O(log n)", "O(n)"]
    why: "An occasional resize copies everything, but doubling makes the average cost per add O(1): amortised O(n) total."
