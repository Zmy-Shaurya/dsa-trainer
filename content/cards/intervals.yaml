concept: intervals
cards:
  - {id: 1, type: basic, front: "What is the first step of Merge Intervals?", back: "Sort by start time."}
  - {id: 2, type: cloze, text: "While merging, set the last end to {{c1::the max of both ends}}, because the next interval may be nested."}
  - {id: 3, type: complexity, prompt: "Time of merging n intervals?", answer: "O(n log n), dominated by the sort"}
  - {id: 4, type: basic, front: "Non-overlapping Intervals: what order and rule give the minimum removals?", back: "Sort by end; keep an interval if it starts at or after the last kept end, otherwise remove it."}
  - {id: 5, type: basic, front: "When do [1,3] and [3,5] overlap?", back: "It depends on the problem. Always decide whether touching endpoints count before coding."}
  - {id: 6, type: basic, front: "Insert Interval: three phases?", back: "Copy intervals ending before the new one, merge all overlapping ones, then copy the rest."}
