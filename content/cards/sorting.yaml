concept: sorting
cards:
  - {id: 1, type: complexity, prompt: "Worst-case time of merge sort?", answer: "O(n log n)"}
  - {id: 2, type: complexity, prompt: "Worst-case time of quicksort, and when does it happen?", answer: "O(n^2), with consistently bad pivots like sorted input and a first-element pivot"}
  - {id: 3, type: trap, prompt: "What is wrong with this comparator?", code: {java: "Arrays.sort(a, (x, y) -> x[0] - y[0]);", cpp: "// C++ comparator must be a strict weak order: use <, not <="}, answer: "Subtraction can overflow for large or negative values. Use Integer.compare(x[0], y[0])."}
  - {id: 4, type: cloze, text: "A sort is {{c1::stable}} if equal elements keep their original relative order."}
  - {id: 5, type: basic, front: "Sort Colors (Dutch flag): what is the O(n) one-pass idea?", back: "Three pointers: low for 0s, high for 2s, and mid scanning; swap into place."}
  - {id: 6, type: basic, front: "How do you find the kth largest in O(n) average?", back: "Quickselect: partition around a pivot and recurse only into the side containing k."}
